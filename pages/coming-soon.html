<script>
  /* Theme + direction boot: applies saved or system preference before first paint */
  (function () { try {
    var t = localStorage.getItem("ff-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var d = localStorage.getItem("ff-dir") || "ltr";
    var h = document.documentElement; h.setAttribute("data-theme", t); h.setAttribute("data-bs-theme", t); h.setAttribute("dir", d);
    if (d === "rtl") h.setAttribute("lang", "ar");
  } catch (e) {} })();
  /* Image fallback: if a remote photo fails, swap in the bundled local image (data-fallback) */
  addEventListener("error", function (e) { var i = e.target;
    if (i.tagName === "IMG" && i.dataset.fallback && i.src.indexOf(i.dataset.fallback) < 0) {
      var p = i.closest("picture"); if (p) p.querySelectorAll("source").forEach(function (s) { s.remove(); });
      i.removeAttribute("srcset"); i.src = i.dataset.fallback; }
  }, true);
</script>
